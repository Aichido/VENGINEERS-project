# ============================================
# SonarCloud - Configuration Vengineers Platform
# ============================================
# NOTE (intégration anticipée, Phase 2 en cours) :
# Décision : Quality Gate STRICT dès maintenant (et non en Phase 8).
# Le pipeline GitHub Actions fait échouer le job si le gate est rouge,
# et la branche main est protégée en conséquence (voir README CI).
# Attention : le gate par défaut "Sonar way" exige ~80% de couverture
# sur le nouveau code -> les premières PR sans tests échoueront tant
# que des tests ne sont pas écrits en parallèle du code.
# ============================================

# À adapter avec vos identifiants SonarCloud réels
sonar.projectKey=Aichido_VENGINEERS-project2
sonar.organization=ichido

sonar.projectName=Vengineers Platform
sonar.projectVersion=1.0
sonar.host.url=https://sonarcloud.io

# --- Sources analysées ---
sonar.sources=backend/app,backend/routes,backend/database,frontend/src

# --- Tests ---
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*Test.php,backend/tests/**/*.php

# --- Exclusions (ne pas analyser) ---
sonar.exclusions=**/vendor/**,**/node_modules/**,**/storage/**,**/bootstrap/cache/**,**/public/build/**,**/dist/**,**/*.min.js,**/database/migrations/**

sonar.coverage.exclusions=**/tests/**,**/*.test.js,**/*.test.jsx,**/database/seeders/**,**/database/factories/**

# --- Couverture de code ---
# Frontend (Vitest/Jest -> lcov)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Backend (PHPUnit/Pest -> Clover XML)
sonar.php.coverage.reportPaths=backend/coverage/clover.xml

# --- Encodage ---
sonar.sourceEncoding=UTF-8
