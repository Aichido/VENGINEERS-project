
services:
  # ---------- Backend Laravel (PHP-FPM) ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vengineers_backend
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./backend/.env
    depends_on:
      - mysql
      - mongo
    networks:
      - vengineers

  # ---------- Nginx (sert l'API Laravel) ----------
  nginx:
    image: nginx:alpine
    container_name: vengineers_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - vengineers

  # ---------- Frontend React (Vite dev server) ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vengineers_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    networks:
      - vengineers

  # ---------- MySQL (données métier) ----------
  mysql:
    image: mysql:8.0
    container_name: vengineers_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vengineers
      MYSQL_USER: vengineers
      MYSQL_PASSWORD: vengineers
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - vengineers

  # ---------- MongoDB (logs & historiques) ----------
  mongo:
    image: mongo:7
    container_name: vengineers_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - vengineers

networks:
  vengineers:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
