name: Frontend CI/CD

on:
  push:
    branches: [main, 'feature/**', 'chore/**']
    paths:
      - "frontend/**"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm run test -- --run

      - name: Build
        working-directory: frontend
        run: npm run build

      # NOTE (23/07/2026) : l'étape "SonarCloud Scan" qui était ici a été
      # retirée. Elle faisait doublon avec le workflow sonarcloud.yml, qui
      # analyse déjà tout le projet (backend + frontend) sous une seule clé
      # SonarCloud unifiée. Garder les deux provoquait une erreur
      # (sonar.projectKey/organization manquants, car ce job n'a pas son
      # propre sonar-project.properties dans frontend/) et risquait de créer
      # des analyses concurrentes sur le même projet.

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t vengineers-frontend:${{ github.sha }} ./frontend

      # Étape suivante : push vers ton registry (Docker Hub / GHCR) + deploy