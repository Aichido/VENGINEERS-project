name: Backend CI/CD

on:
  push:
    branches: [main, 'feature/**', 'chore/**']
    paths:
      - "backend/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: vengineers_test
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, mongodb-2.4.0

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Copy .env
        working-directory: backend
        run: cp .env.example .env && php artisan key:generate

      - name: Configure environment for CI
        working-directory: backend
        run: |
          php artisan config:clear
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=vengineers_test/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env

      - name: Run migrations
        working-directory: backend
        run: php artisan migrate --force

      - name: Run tests
        working-directory: backend
        run: php artisan test

      # NOTE (23/07/2026) : l'étape "SonarCloud Scan" qui était ici a été
      # retirée. Elle faisait doublon avec le workflow sonarcloud.yml, qui
      # analyse déjà tout le projet (backend + frontend) sous une seule clé
      # SonarCloud unifiée. Garder les deux provoquait une erreur
      # (sonar.projectKey/organization manquants, car ce job n'a pas son
      # propre sonar-project.properties dans backend/) et risquait de créer
      # des analyses concurrentes sur le même projet. Voir aussi la même
      # correction appliquée à frontend-ci.yml.

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t vengineers-backend:${{ github.sha }} ./backend

      # Étape suivante : push vers ton registry (Docker Hub / GHCR) + deploy