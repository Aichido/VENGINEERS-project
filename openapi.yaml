openapi: 3.0.0
info:
  title: Vengineers API
  description: >-
    API de la plateforme Vengineers – gestion des produits, commandes,
    interventions, utilisateurs et logs. Ce document constitue le contrat
    entre le frontend et le backend.
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Serveur de développement (Docker)
  - url: https://api.vengineers.mu
    description: Serveur de production

tags:
  - name: Auth
    description: Authentification et gestion du compte
  - name: Public
    description: Endpoints accessibles sans authentification
  - name: Client
    description: Réservé aux utilisateurs ayant le rôle `client`
  - name: Commercial
    description: Réservé aux utilisateurs ayant le rôle `commercial`
  - name: Technicien
    description: Réservé aux utilisateurs ayant le rôle `technicien`
  - name: Admin
    description: Réservé aux utilisateurs ayant le rôle `admin`
  - name: Fichiers
    description: Téléchargement de fichiers (rapports)

paths:
  # ============ AUTH ============
  /api/register:
    post:
      tags:
        - Auth
      summary: Inscription d'un nouvel utilisateur
      description: Crée un compte avec le rôle `client` par défaut.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - password_confirmation
              properties:
                name:
                  type: string
                  example: Jean Dupont
                email:
                  type: string
                  format: email
                  example: jean@example.com
                password:
                  type: string
                  format: password
                  example: Secret123!
                password_confirmation:
                  type: string
                  format: password
                  example: Secret123!
      responses:
        '201':
          description: Utilisateur créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/login:
    post:
      tags:
        - Auth
      summary: Connexion
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: jean@example.com
                password:
                  type: string
                  format: password
                  example: Secret123!
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Identifiants incorrects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/logout:
    post:
      tags:
        - Auth
      summary: Déconnexion
      security:
        - sanctum: []
      responses:
        '204':
          description: Déconnexion réussie
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me:
    get:
      tags:
        - Auth
      summary: Récupérer l'utilisateur connecté
      security:
        - sanctum: []
      responses:
        '200':
          description: Utilisateur courant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============ PUBLIC ============
  /api/categories:
    get:
      tags:
        - Public
      summary: Liste des catégories (triées par nom)
      responses:
        '200':
          description: Liste des catégories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

  /api/products:
    get:
      tags:
        - Public
      summary: Liste des produits actifs (paginés)
      description: Retourne uniquement les produits `is_active = true`.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 9
        - name: category
          in: query
          schema:
            type: integer
          description: ID de la catégorie pour filtrer
        - name: min_price
          in: query
          schema:
            type: number
            format: float
        - name: max_price
          in: query
          schema:
            type: number
            format: float
        - name: search
          in: query
          schema:
            type: string
          description: Recherche dans `name` et `description`
      responses:
        '200':
          description: Liste paginée de produits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPaginated'

  /api/products/{id}:
    get:
      tags:
        - Public
      summary: Détail d'un produit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Produit trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Produit inexistant ou inactif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/contact:
    post:
      tags:
        - Public
      summary: Envoyer un message de contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - subject
                - message
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                  maxLength: 255
                subject:
                  type: string
                  maxLength: 255
                message:
                  type: string
                  maxLength: 5000
      responses:
        '201':
          description: Message envoyé
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Message envoyé avec succès.
        '422':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  # ============ CLIENT ============
  /api/client/orders:
    get:
      tags:
        - Client
      summary: Liste des commandes du client connecté
      security:
        - sanctum: []
      responses:
        '200':
          description: Liste des commandes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '403':
          description: Rôle non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Client
      summary: Créer une commande
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - product_id
                      - quantity
                    properties:
                      product_id:
                        type: integer
                      quantity:
                        type: integer
                        minimum: 1
      responses:
        '201':
          description: Commande créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '422':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/client/orders/{order}:
    get:
      tags:
        - Client
      summary: Détail d'une commande (appartenant au client)
      security:
        - sanctum: []
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Détail de la commande
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '403':
          description: La commande n'appartient pas à ce client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Commande introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/client/orders/{order}/history:
    get:
      tags:
        - Client
      summary: Historique des statuts d'une commande
      security:
        - sanctum: []
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Historique des statuts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    status:
                      type: string
                    created_at:
                      type: string
                      format: date-time
                    user_id:
                      type: integer
                      nullable: true

  /api/client/interventions:
    get:
      tags:
        - Client
      summary: Liste des interventions du client
      security:
        - sanctum: []
      responses:
        '200':
          description: Liste des interventions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Intervention'
    post:
      tags:
        - Client
      summary: Créer une demande d'intervention
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
              properties:
                title:
                  type: string
                description:
                  type: string
                date_souhaitee:
                  type: string
                  format: date
                  nullable: true
                priorite:
                  type: string
                  enum: [basse, normale, haute]
                  default: normale
                  description: La priorité est toujours forcée à `normale` pour les clients.
      responses:
        '201':
          description: Intervention créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Intervention'
        '422':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/client/interventions/{intervention}/history:
    get:
      tags:
        - Client
      summary: Historique des statuts d'une intervention
      security:
        - sanctum: []
      parameters:
        - name: intervention
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Historique des statuts

  # ============ COMMERCIAL ============
  /api/commercial/orders:
    get:
      tags:
        - Commercial
      summary: Liste toutes les commandes (sans restriction de client)
      security:
        - sanctum: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, validated, shipped, delivered, cancelled]
      responses:
        '200':
          description: Liste des commandes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /api/commercial/orders/{order}:
    get:
      tags:
        - Commercial
      summary: Détail d'une commande
      security:
        - sanctum: []
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Détail de la commande
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
    put:
      tags:
        - Commercial
      summary: Mettre à jour le statut d'une commande
      security:
        - sanctum: []
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [validated, shipped, delivered, cancelled]
      responses:
        '200':
          description: Statut mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '422':
          description: Transition invalide ou stock insuffisant

  /api/commercial/orders/{order}/history:
    get:
      tags:
        - Commercial
      summary: Historique des statuts d'une commande
      security:
        - sanctum: []
      parameters:
        - name: order
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Historique

  /api/commercial/stock:
    get:
      tags:
        - Commercial
      summary: Liste des produits avec leur stock (trié par quantité croissante)
      security:
        - sanctum: []
      parameters:
        - name: category
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Liste des stocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductStock'

  /api/commercial/stock/{product}/notify-low-stock:
    post:
      tags:
        - Commercial
      summary: Déclencher une alerte de stock bas
      security:
        - sanctum: []
      parameters:
        - name: product
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Alerte envoyée à tous les admins
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Alerte de stock bas envoyée.

  # ============ TECHNICIEN ============
  /api/technicien/interventions:
    get:
      tags:
        - Technicien
      summary: Liste des interventions assignées au technicien
      security:
        - sanctum: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [nouvelle, assignee, en_cours, terminee]
      responses:
        '200':
          description: Liste des interventions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Intervention'

  /api/technicien/interventions/{intervention}:
    get:
      tags:
        - Technicien
      summary: Détail d'une intervention assignée
      security:
        - sanctum: []
      parameters:
        - name: intervention
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Détail de l'intervention
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Intervention'
        '403':
          description: L'intervention n'est pas assignée à ce technicien
    put:
      tags:
        - Technicien
      summary: Mettre à jour le statut d'une intervention
      security:
        - sanctum: []
      parameters:
        - name: intervention
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [en_cours, terminee]
                comment:
                  type: string
      responses:
        '200':
          description: Statut mis à jour

  /api/technicien/interventions/{intervention}/report:
    post:
      tags:
        - Technicien
      summary: Ajouter un rapport à une intervention
      security:
        - sanctum: []
      parameters:
        - name: intervention
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Fichier PDF, JPG, PNG (max 10 Mo)
      responses:
        '201':
          description: Rapport ajouté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterventionReport'

  /api/technicien/reports:
    get:
      tags:
        - Technicien
      summary: Liste des rapports soumis par le technicien
      security:
        - sanctum: []
      responses:
        '200':
          description: Liste des rapports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InterventionReport'

  /api/interventions/{intervention}/reports/{report}/download:
    get:
      tags:
        - Fichiers
      summary: Télécharger un rapport
      description: Accessible à l'admin, au client concerné et au technicien auteur.
      parameters:
        - name: intervention
          in: path
          required: true
          schema:
            type: integer
        - name: report
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Fichier
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: Non autorisé à télécharger ce rapport
        '404':
          description: Rapport ou fichier introuvable

  /api/technicien/interventions/{intervention}/history:
    get:
      tags:
        - Technicien
      summary: Historique des statuts d'une intervention
      security:
        - sanctum: []
      parameters:
        - name: intervention
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Historique

  # ============ ADMIN ============
  /api/admin/users:
    get:
      tags:
        - Admin
      summary: Liste des utilisateurs
      security:
        - sanctum: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [client, commercial, technicien, admin]
        - name: search
          in: query
          schema:
            type: string
          description: Recherche dans `name` ou `email`
      responses:
        '200':
          description: Liste des utilisateurs (soft deletes exclus)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags:
        - Admin
      summary: Créer un compte staff
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - password_confirmation
                - role
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                password_confirmation:
                  type: string
                  format: password
                role:
                  type: string
                  enum: [commercial, technicien, admin]
      responses:
        '201':
          description: Utilisateur créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/admin/users/{user}:
    put:
      tags:
        - Admin
      summary: Modifier un utilisateur
      security:
        - sanctum: []
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                role:
                  type: string
                  enum: [client, commercial, technicien, admin]
      responses:
        '200':
          description: Utilisateur mis à jour
    delete:
      tags:
        - Admin
      summary: Supprimer (soft delete) un utilisateur
      security:
        - sanctum: []
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Utilisateur supprimé

  /api/admin/users/{user}/toggle-active:
    patch:
      tags:
        - Admin
      summary: Activer / désactiver un utilisateur
      security:
        - sanctum: []
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Statut modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/admin/categories:
    post:
      tags:
        - Admin
      summary: Créer une catégorie
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                slug:
                  type: string
                  description: Optionnel – auto-généré si non fourni
      responses:
        '201':
          description: Catégorie créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'

  /api/admin/categories/{category}:
    put:
      tags:
        - Admin
      summary: Modifier une catégorie
      security:
        - sanctum: []
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
      responses:
        '200':
          description: Catégorie mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
    delete:
      tags:
        - Admin
      summary: Supprimer une catégorie (uniquement si aucun produit associé)
      security:
        - sanctum: []
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Catégorie supprimée
        '409':
          description: La catégorie contient des produits

  /api/admin/products:
    get:
      tags:
        - Admin
      summary: Liste de tous les produits (actifs et inactifs)
      security:
        - sanctum: []
      responses:
        '200':
          description: Liste des produits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      tags:
        - Admin
      summary: Créer un produit
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - price
                - category_id
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                  format: float
                  minimum: 0
                stock_qty:
                  type: integer
                  minimum: 0
                  default: 0
                category_id:
                  type: integer
                is_active:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Produit créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

  /api/admin/products/{product}:
    put:
      tags:
        - Admin
      summary: Modifier un produit
      security:
        - sanctum: []
      parameters:
        - name: product
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                  format: float
                stock_qty:
                  type: integer
                category_id:
                  type: integer
                is_active:
                  type: boolean
      responses:
        '200':
          description: Produit mis à jour
    delete:
      tags:
        - Admin
      summary: Supprimer un produit (entraîne la suppression de ses images)
      security:
        - sanctum: []
      parameters:
        - name: product
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Produit supprimé

  /api/admin/products/{product}/images:
    post:
      tags:
        - Admin
      summary: Ajouter une image à un produit
      security:
        - sanctum: []
      parameters:
        - name: product
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: Fichier image (JPG, PNG, WEBP)
      responses:
        '201':
          description: Image ajoutée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductImage'

  /api/admin/products/{product}/images/reorder:
    patch:
      tags:
        - Admin
      summary: Réordonner les images d'un produit
      security:
        - sanctum: []
      parameters:
        - name: product
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - order
              properties:
                order:
                  type: array
                  items:
                    type: integer
                  description: Liste des IDs d'images dans l'ordre souhaité
      responses:
        '200':
          description: Ordre mis à jour

  /api/admin/products/{product}/images/{image}:
    delete:
      tags:
        - Admin
      summary: Supprimer une image d'un produit
      security:
        - sanctum: []
      parameters:
        - name: product
          in: path
          required: true
          schema:
            type: integer
        - name: image
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Image supprimée

  /api/admin/products/{product}/images/{image}/set-primary:
    patch:
      tags:
        - Admin
      summary: Définir une image comme image principale
      security:
        - sanctum: []
      parameters:
        - name: product
          in: path
          required: true
          schema:
            type: integer
        - name: image
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Image principale mise à jour

  /api/admin/interventions:
    get:
      tags:
        - Admin
      summary: Liste de toutes les interventions
      security:
        - sanctum: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [nouvelle, assignee, en_cours, terminee]
        - name: technicien_id
          in: query
          schema:
            type: integer
        - name: priority
          in: query
          schema:
            type: string
            enum: [basse, normale, haute]
      responses:
        '200':
          description: Liste des interventions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Intervention'
    post:
      tags:
        - Admin
      summary: Créer une intervention pour un client existant
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - client_id
                - title
                - description
              properties:
                client_id:
                  type: integer
                title:
                  type: string
                description:
                  type: string
                date_souhaitee:
                  type: string
                  format: date
                priorite:
                  type: string
                  enum: [basse, normale, haute]
                  default: normale
      responses:
        '201':
          description: Intervention créée

  /api/admin/interventions/{intervention}/reports:
    get:
      tags:
        - Admin
      summary: Liste des rapports d'une intervention
      security:
        - sanctum: []
      parameters:
        - name: intervention
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Liste des rapports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InterventionReport'

  /api/admin/interventions/{intervention}/assign:
    post:
      tags:
        - Admin
      summary: Assigner une intervention à un technicien
      security:
        - sanctum: []
      parameters:
        - name: intervention
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - technicien_id
              properties:
                technicien_id:
                  type: integer
      responses:
        '200':
          description: Intervention assignée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Intervention'
        '422':
          description: Technicien invalide ou intervention déjà en cours

  /api/admin/stats:
    get:
      tags:
        - Admin
      summary: Statistiques globales
      security:
        - sanctum: []
      responses:
        '200':
          description: Statistiques
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_revenue:
                    type: number
                  orders_count:
                    type: object
                  interventions_count:
                    type: object
                  users_count:
                    type: object

  /api/admin/logs:
    get:
      tags:
        - Admin
      summary: Logs d'activité (paginés)
      security:
        - sanctum: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [activity_log, order_history, intervention_history, login_audit]
        - name: user_id
          in: query
          schema:
            type: integer
        - name: action
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Logs paginés
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                  meta:
                    type: object

  /api/admin/notifications:
    get:
      tags:
        - Admin
      summary: Liste des notifications de l'admin
      security:
        - sanctum: []
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /api/admin/notifications/unread-count:
    get:
      tags:
        - Admin
      summary: Nombre de notifications non lues
      security:
        - sanctum: []
      responses:
        '200':
          description: Compteur
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread_count:
                    type: integer

  /api/admin/notifications/{id}/read:
    patch:
      tags:
        - Admin
      summary: Marquer une notification comme lue
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Notification marquée comme lue

components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Utiliser le token Bearer retourné par `/api/login` ou `/api/register`.

  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string

    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: Token Bearer à utiliser dans les requêtes authentifiées

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
              enum: [client, commercial, technicien, admin]
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductImage:
      type: object
      properties:
        id:
          type: integer
        product_id:
          type: integer
        path:
          type: string
        thumbnail_path:
          type: string
        position:
          type: integer
        is_primary:
          type: boolean
        url:
          type: string
        thumbnail_url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          format: float
        stock_qty:
          type: integer
        category_id:
          type: integer
        is_active:
          type: boolean
        category:
          $ref: '#/components/schemas/Category'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductPaginated:
      type: object
      properties:
        current_page:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        first_page_url:
          type: string
        from:
          type: integer
          nullable: true
        last_page:
          type: integer
        last_page_url:
          type: string
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                nullable: true
              label:
                type: string
              active:
                type: boolean
        next_page_url:
          type: string
          nullable: true
        path:
          type: string
        per_page:
          type: integer
        prev_page_url:
          type: string
          nullable: true
        to:
          type: integer
          nullable: true
        total:
          type: integer

    ProductStock:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            stock_qty:
              type: integer

    OrderItem:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        product_id:
          type: integer
        quantity:
          type: integer
        unit_price:
          type: number
          format: float
        product:
          $ref: '#/components/schemas/Product'

    Order:
      type: object
      properties:
        id:
          type: integer
        client_id:
          type: integer
        commercial_id:
          type: integer
          nullable: true
        status:
          type: string
          enum: [pending, validated, shipped, delivered, cancelled]
        total:
          type: number
          format: float
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Intervention:
      type: object
      properties:
        id:
          type: integer
        public_id:
          type: string
          description: Identifiant public (ex: INT-2024-001)
        client_id:
          type: integer
        technicien_id:
          type: integer
          nullable: true
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [nouvelle, assignee, en_cours, terminee]
        priorite:
          type: string
          enum: [basse, normale, haute]
        date_souhaitee:
          type: string
          format: date
          nullable: true
        reports:
          type: array
          items:
            $ref: '#/components/schemas/InterventionReport'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    InterventionReport:
      type: object
      properties:
        id:
          type: integer
        intervention_id:
          type: integer
        technicien_id:
          type: integer
        fichier_path:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time